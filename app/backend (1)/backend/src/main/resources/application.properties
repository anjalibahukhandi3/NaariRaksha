spring.application.name=NaariRaksha-Backend
server.port=${PORT:8080}

# Database Configuration
# Using environment variables for production, defaulting to H2 for local testing
spring.datasource.url=${DB_URL:jdbc:h2:mem:naariraksha_db}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update

# H2 Console (useful for debugging, disable in production if needed)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
